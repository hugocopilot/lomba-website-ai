<!DOCTYPE html>
<html lang="id">
    <head>
        <meta charset="UTF-8" />
        <meta name="viewport" content="width=device-width initial-scale=1" />
        <title>Lomba Design Web AI</title>
        <link rel="stylesheet" href="css/style.css" />
        <script src="js/words.js" defer></script>
    </head>
    <body>
        <div class="splash">
            <div class="shape circle"></div>
            <div class="shape square"></div>
            <div class="shape triangle"></div>
            <img class="splash-logo" src="assets/al-irsyad-logo.png" alt="Logo Al-Irsyad Al-Islamiyyah">
        </div>
        <section class="hero">
            <div class="group">
                <h1 class="line" lang="ar" dir="rtl" data-words style="--start: 3s">السلام عليكم ورحمة الله وبركاته</h1>
            </div>
            <div class="group">
            <h1 class="line" data-words style="--start: 6.7s">Selamat Datang</h1>
            <h1 class="line" data-words style="--start: 6.9s">Di Website Al-Irsyad</h1>
            </div>
            
        </section>
    </body>
</html>
